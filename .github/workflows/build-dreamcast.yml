
name: Build QuakeSpasm Dreamcast CDI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential make cmake \
            gawk patch bzip2 texinfo gettext \
            libgmp-dev libmpfr-dev libmpc-dev \
            libelf-dev bison flex wget curl \
            python3 pkg-config meson ninja-build \
            libisofs-dev libjpeg-dev libpng-dev

      - name: Checkout QuakeSpasm
        uses: actions/checkout@v4

      - name: Prepare KallistiOS
        run: |
          sudo mkdir -p /opt/toolchains/dc
          sudo chown -R "$USER":"$USER" /opt/toolchains/dc
          git clone --depth 1 \
            https://github.com/KallistiOS/KallistiOS.git \
            /opt/toolchains/dc/kos

      
      - name: Build Dreamcast toolchain
        run: |
          cd /opt/toolchains/dc/kos/utils/kos-chain
          cp Makefile.dreamcast.cfg Makefile.cfg

      - name: Build KallistiOS
        run: |
          cd /opt/toolchains/dc/kos
          cp doc/environ.sh.sample environ.sh
          . ./environ.sh
          make

          
      - name: Checkout KallistiOS ports
        run: |
          git clone --depth 1 \
            https://github.com/KallistiOS/kos-ports.git \
            /opt/toolchains/dc/kos-ports

        - name: Check Dreamcast build requirements
        run: |
          source /opt/toolchains/dc/kos/environ.sh
          echo "KOS_BASE=$KOS_BASE"
          command -v kos-cc
          command -v mkdcdisc || true
          test -f Quake/Makefile.dreamcast
          test -f Quake/build_dreamcast.sh
          test -f Dreamcast/cd/id1/pak0.pak
          ls -lh Dreamcast/cd/id1/pak0.pak

          
      - name: Build QuakeSpasm and create CDI
        run: |
          source /opt/toolchains/dc/kos/environ.sh
          chmod +x Quake/build_dreamcast.sh
          ./Quake/build_dreamcast.sh


          make

